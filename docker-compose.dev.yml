version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_HCAPTCHA_SITEKEY=10000000-ffff-ffff-ffff-000000000001
      - NEXT_PUBLIC_CTFD_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      - backend
    networks:
      - ace-network
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ace-network
    stdin_open: true
    tty: true

  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=acedb_dev
      - POSTGRES_USER=aceuser
      - POSTGRES_PASSWORD=acepass_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - ace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aceuser -d acedb_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - ace-network

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - ace-network

networks:
  ace-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
