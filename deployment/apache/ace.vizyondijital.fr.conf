<VirtualHost *:80>
    ServerName ace.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/ace-error.log
    CustomLog ${APACHE_LOG_DIR}/ace-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ace.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ace.vizyondijital.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ace.vizyondijital.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Proxy vers Nginx dans Docker (port 8080)
    ProxyPreserveHost On
    ProxyPass / http://localhost:8080/
    ProxyPassReverse / http://localhost:8080/

    # WebSocket support (pour Next.js HMR en dev)
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:8080/$1" [P,L]

    # Headers de sécurité
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/ace-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ace-ssl-access.log combined
</VirtualHost>
