<VirtualHost *:80>
    ServerName api.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/api-error.log
    CustomLog ${APACHE_LOG_DIR}/api-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName api.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.vizyondijital.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.vizyondijital.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Proxy vers Backend Express (port 5000)
    # IMPORTANT: Le backend tourne dans Docker et expose le port 5000 sur l'hôte
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    
    # Timeout augmenté pour les requêtes lentes
    ProxyTimeout 300

    # Headers de sécurité
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # CORS géré par le backend Express - ne pas écraser ici
    # Le backend ajoute déjà les headers Access-Control-Allow-Origin

    # Logs détaillés pour debug
    ErrorLog ${APACHE_LOG_DIR}/api-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/api-ssl-access.log combined
    LogLevel warn
</VirtualHost>
