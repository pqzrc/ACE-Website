<VirtualHost *:80>
    ServerName api.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/api-error.log
    CustomLog ${APACHE_LOG_DIR}/api-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName api.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.vizyondijital.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.vizyondijital.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Proxy direct vers Backend Express (port 5000)
    ProxyPreserveHost On
    ProxyPass / http://localhost:5000/
    ProxyPassReverse / http://localhost:5000/

    # Headers de sécurité
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # CORS Headers (si nécessaire)
    Header always set Access-Control-Allow-Origin "https://ace.vizyondijital.fr"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
    Header always set Access-Control-Allow-Credentials "true"

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/api-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/api-ssl-access.log combined
</VirtualHost>
