name: ace-website

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_HCAPTCHA_SITEKEY=${NEXT_PUBLIC_HCAPTCHA_SITEKEY}
        - NEXT_PUBLIC_CTFD_URL=${NEXT_PUBLIC_CTFD_URL}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_HCAPTCHA_SITEKEY=${NEXT_PUBLIC_HCAPTCHA_SITEKEY}
      - NEXT_PUBLIC_CTFD_URL=${NEXT_PUBLIC_CTFD_URL}
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ace-network
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      # Frontend routing
      - "traefik.http.routers.ace-frontend.rule=Host(`ace.vizyondijital.fr`)"
      - "traefik.http.routers.ace-frontend.entrypoints=websecure"
      - "traefik.http.routers.ace-frontend.tls=true"
      - "traefik.http.routers.ace-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ace-frontend.loadbalancer.server.port=3000"

      # Security headers
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.secure-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"

      # Apply middleware
      - "traefik.http.routers.ace-frontend.middlewares=secure-headers"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ace-network
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      # Backend API routing
      - "traefik.http.routers.ace-backend.rule=Host(`api.vizyondijital.fr`)"
      - "traefik.http.routers.ace-backend.entrypoints=websecure"
      - "traefik.http.routers.ace-backend.tls=true"
      - "traefik.http.routers.ace-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ace-backend.loadbalancer.server.port=5000"

      # CORS middleware - Allow specific origins
      - "traefik.http.middlewares.backend-cors.headers.accessControlAllowMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.backend-cors.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Webhook-Signature"
      - "traefik.http.middlewares.backend-cors.headers.accessControlAllowOriginList=https://ace.vizyondijital.fr,https://ctfd.vizyondijital.fr"
      - "traefik.http.middlewares.backend-cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.backend-cors.headers.accessControlMaxAge=3600"

      # Apply middleware (cors + secure headers)
      - "traefik.http.routers.ace-backend.middlewares=backend-cors,secure-headers"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-acedb}
      - POSTGRES_USER=${POSTGRES_USER:-aceuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ace-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aceuser} -d ${POSTGRES_DB:-acedb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ace-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ace-network:
    driver: bridge
    internal: true

  traefik-public:
    external: true

volumes:
  postgres_data:
  redis_data:
